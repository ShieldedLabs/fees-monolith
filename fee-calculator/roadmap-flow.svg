<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dynamic fees rollout flow: experimental wallet pilots to gather user behavior data, then fee suggestion endpoint, then optional parameter refinement, then optional consensus hardening.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b728"/>
    </marker>
  </defs>

  <!-- Stage 1: Experimental Wallet Pilots (active) -->
  <g>
    <rect x="20" y="40" width="240" height="120" rx="12" fill="#131a2b" stroke="#f4b728" stroke-width="1.5"/>
    <text x="140" y="88" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Experimental</text>
    <text x="140" y="110" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Wallet Pilots</text>
    <text x="140" y="136" text-anchor="middle" fill="#6b7394" font-size="12.5">gather user-behavior data</text>
  </g>

  <!-- arrow 1 -->
  <line x1="266" y1="100" x2="298" y2="100" stroke="#f4b728" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Fee Suggestion Endpoint (active) -->
  <g>
    <rect x="304" y="40" width="240" height="120" rx="12" fill="#131a2b" stroke="#f4b728" stroke-width="1.5"/>
    <text x="424" y="88" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Fee Suggestion</text>
    <text x="424" y="110" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Endpoint</text>
    <text x="424" y="136" text-anchor="middle" fill="#6b7394" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">z_getstandardfee</text>
  </g>

  <!-- arrow 2 -->
  <line x1="550" y1="100" x2="582" y2="100" stroke="#f4b728" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Parameter Refinement (optional) -->
  <g opacity="0.72">
    <rect x="588" y="40" width="240" height="120" rx="12" fill="#131a2b" stroke="#6b7394" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="708" y="88" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Parameter</text>
    <text x="708" y="110" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Refinement</text>
    <rect x="668" y="124" width="80" height="20" rx="10" fill="none" stroke="#6b7394" stroke-width="1"/>
    <text x="708" y="138" text-anchor="middle" fill="#6b7394" font-size="10" letter-spacing="1.5">OPTIONAL</text>
  </g>

  <!-- arrow 3 -->
  <line x1="834" y1="100" x2="866" y2="100" stroke="#f4b728" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Consensus Hardening (optional) -->
  <g opacity="0.72">
    <rect x="872" y="40" width="240" height="120" rx="12" fill="#131a2b" stroke="#6b7394" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="992" y="88" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Consensus</text>
    <text x="992" y="110" text-anchor="middle" fill="#e0e4ef" font-size="17" font-weight="600">Hardening</text>
    <rect x="952" y="124" width="80" height="20" rx="10" fill="none" stroke="#6b7394" stroke-width="1"/>
    <text x="992" y="138" text-anchor="middle" fill="#6b7394" font-size="10" letter-spacing="1.5">OPTIONAL</text>
  </g>
</svg>
