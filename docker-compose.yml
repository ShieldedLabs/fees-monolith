# Dynamic Fees — Zaino + lightwalletd with z_getstandardfee
#
# Both indexers proxy fee estimation to zebrad's native z_getstandardfee RPC.
# Assumes zebrad is running on the zcash_default Docker network.
#
# Usage:
#   docker compose build
#   docker compose up -d
#
#   # Zaino JSON-RPC:
#   curl -X POST http://127.0.0.1:18088 \
#     -H "Content-Type: application/json" \
#     -d '{"jsonrpc":"2.0","method":"z_getstandardfee","id":1}'
#
#   # lightwalletd gRPC:
#   grpcurl -plaintext localhost:19067 \
#     cash.z.wallet.sdk.rpc.CompactTxStreamer/GetStandardFee

services:
  zaino-fees:
    build:
      context: ./zaino
      dockerfile: Dockerfile
      args:
        NO_TLS: "true"
        # Upstream zaino dev Dockerfile requires RUST_VERSION (no default); pin to the
        # repo's rust-toolchain.toml channel so `FROM rust:${RUST_VERSION}-bookworm` resolves.
        RUST_VERSION: "1.95.0"
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - ZAINO_BACKEND=fetch
      - ZAINO_NETWORK=Mainnet
      - ZAINO_VALIDATOR_SETTINGS__VALIDATOR_JSONRPC_LISTEN_ADDRESS=zebrad:8232
      - ZAINO_GRPC_SETTINGS__LISTEN_ADDRESS=0.0.0.0:8137
      # Newer zaino refuses a public (0.0.0.0) JSON-RPC bind without the
      # allow_unencrypted_public_json_rpc_bind build feature. Loopback satisfies the
      # check; the gRPC server (8137) is what wallets use. Switch to the feature build
      # if this JSON-RPC re-expose needs host reachability.
      - ZAINO_JSON_SERVER_SETTINGS__JSON_RPC_LISTEN_ADDRESS=127.0.0.1:8088
    volumes:
      - /Users/mark/.cache/zaino:/home/container_user/.cache/zaino
      - ./config/zainod.toml:/etc/zaino/zainod.toml:ro
    command: ["start", "--config", "/etc/zaino/zainod.toml"]
    ports:
      - "18137:8137"  # gRPC
      - "18088:8088"  # JSON-RPC (z_getstandardfee)

  lightwalletd-fees:
    build:
      context: ./lightwalletd
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - --zcash-conf-path=/etc/lightwalletd/zcash.conf
      - --grpc-bind-addr=0.0.0.0:9067
      - --data-dir=/var/lib/lightwalletd/db
      - --log-file=/dev/stdout
      - --log-level=7
      - --no-tls-very-insecure
    volumes:
      - ./config/zcash.conf:/etc/lightwalletd/zcash.conf:ro
      - lwd-fees-cache:/var/lib/lightwalletd/db
    ports:
      - "19067:9067"  # gRPC (GetStandardFee)

networks:
  default:
    external: true
    name: zcash_default

volumes:
  lwd-fees-cache:
